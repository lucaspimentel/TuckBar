name: Release

env:
  ASSEMBLY_NAME: TuckBar
  PROJECT_NAME: TuckBar
  PROJECT_FILE: src/TuckBar/TuckBar.csproj

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
        type: string
      dry_run:
        description: 'Build and test only; skip publishing and release creation'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-inputs:
    runs-on: ubuntu-latest

    steps:
    - name: Validate workflow inputs
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
          && [ "${{ inputs.dry_run }}" != "true" ] \
          && [ -z "${{ inputs.version }}" ]; then
          echo "::error::version is required when dry_run is false"
          exit 1
        fi

  ci:
    needs: check-inputs
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore TuckBar.slnx

    - name: Publish
      run: dotnet publish ${{ env.PROJECT_FILE }} -c Release -r win-x64

    - name: Prepare release files
      shell: pwsh
      run: |
        $dist = "release-staging"
        New-Item -ItemType Directory -Path $dist -Force | Out-Null
        Copy-Item "artifacts/publish/${{ env.PROJECT_NAME }}/release_win-x64/${{ env.ASSEMBLY_NAME }}.exe" $dist/
        Copy-Item LICENSE $dist/ -ErrorAction SilentlyContinue
        Copy-Item README.md $dist/

    - name: Create archive
      shell: pwsh
      run: |
        Compress-Archive -Path release-staging/* -DestinationPath ${{ env.ASSEMBLY_NAME }}-win-x64.zip

    - name: Generate checksum
      shell: pwsh
      run: |
        $hash = Get-FileHash -Path ${{ env.ASSEMBLY_NAME }}-win-x64.zip -Algorithm SHA256
        "$($hash.Hash)  ${{ env.ASSEMBLY_NAME }}-win-x64.zip" | Out-File -FilePath checksum-win-x64.txt -Encoding ascii

    - name: Upload artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: ${{ env.ASSEMBLY_NAME }}-win-x64
        path: |
          ${{ env.ASSEMBLY_NAME }}-win-x64.zip
          checksum-win-x64.txt

  release:
    needs: build
    if: github.event_name == 'push' || !inputs.dry_run
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Download artifacts
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: ${{ env.ASSEMBLY_NAME }}-win-x64
        path: ${{ env.ASSEMBLY_NAME }}-win-x64

    - name: Combine checksums
      run: cat ${{ env.ASSEMBLY_NAME }}-win-x64/checksum-win-x64.txt > checksums.txt

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: v${{ steps.version.outputs.version }}
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        generate_release_notes: true
        files: |
          ${{ env.ASSEMBLY_NAME }}-win-x64/${{ env.ASSEMBLY_NAME }}-win-x64.zip
          checksums.txt
